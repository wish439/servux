name: Apply Patches
on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: '基于哪个分支'
        default: '26.1-upstream'
      patch_dir:
        description: '仓库内补丁目录'
        default: 'patches'
      branch_name:
        description: '新分支名（留空自动生成）'
        default: ''
      create_pr:
        description: '是否开 PR'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: 建分支并逐个应用（失败跳过）
        id: apply
        shell: bash
        run: |
          set -uo pipefail

          BRANCH="${{ inputs.branch_name }}"
          [ -z "$BRANCH" ] && BRANCH="patch/apply-${{ github.run_id }}"
          git checkout -b "$BRANCH"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          applied=()
          failed=()

          apply_one() {
            local f="$1"
            echo "==> $f"
            # 有邮件头走 git am，否则走 git apply
            if head -n1 "$f" | grep -q '^From '; then
              if git am --3way "$f" >/dev/null 2>&1; then
                applied+=("$f"); return 0
              fi
              git am --abort 2>/dev/null || true
            else
              if git apply --check "$f" >/dev/null 2>&1 \
                 && git apply "$f" >/dev/null 2>&1; then
                git add -A
                git commit -q -m "apply: $(basename "$f")"
                applied+=("$f"); return 0
              fi
            fi
            # 失败：清掉残留，保留之前成功的 commit
            git reset --hard HEAD >/dev/null 2>&1
            git clean -fd >/dev/null 2>&1
            failed+=("$f")
            return 1
          }

          shopt -s nullglob
          for f in "${{ inputs.patch_dir }}"/*.patch "${{ inputs.patch_dir }}"/*.diff; do
            apply_one "$f" || true
          done

          # 失败清单写进分支，方便你 checkout 后对照
          if [ ${#failed[@]} -gt 0 ]; then
            {
              echo "# 未能应用的补丁"
              echo
              for f in "${failed[@]}"; do echo "- \`$f\`"; done
              echo
              echo "存在冲突或上下文不匹配，需要手动处理。"
            } > APPLY_PATCH_FAILURES.md
            git add APPLY_PATCH_FAILURES.md
            git commit -q -m "chore: record failed patches"
          fi

          # 输出到 job summary
          {
            echo "## 成功 (${#applied[@]})"
            for f in "${applied[@]}"; do echo "- $f"; done
            echo "## 失败 (${#failed[@]})"
            for f in "${failed[@]}"; do echo "- $f"; done
          } >> "$GITHUB_STEP_SUMMARY"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          COMMITS=$(git rev-list --count "${{ inputs.base_branch }}..HEAD")
          echo "has_commits=$([ "$COMMITS" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: 推送分支
        run: git push -u origin "${{ steps.apply.outputs.branch }}"

      - name: 创建 PR
        if: ${{ inputs.create_pr && steps.apply.outputs.has_commits == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base "${{ inputs.base_branch }}" \
            --head "${{ steps.apply.outputs.branch }}" \
            --title "Apply patches (${{ github.run_id }})" \
            --body "手动触发的补丁应用。失败清单见 \`APPLY_PATCH_FAILURES.md\` 和本次 run 的 Summary。"
